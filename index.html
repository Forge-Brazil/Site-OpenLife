    <script>
      // Design system oficial OpenLife — roxo #6B2D8B + laranja #F57C20,
      // a identidade original da marca (Poppins/Inter). Definido nativamente
      // no Tailwind para que bg-purple-brand, text-orange-brand, shadow-purple-brand/20
      // etc. funcionem em qualquer tom sem precisar de CSS manual por classe.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'purple-brand': '#6B2D8B',
              'orange-brand': '#F57C20',
              primary: { DEFAULT: '#6B2D8B', dark: '#52206B' },
              accent: { DEFAULT: '#F57C20', light: '#FFA057' },
              bgsoft: '#F6F4FF',
              textmuted: '#6B6B6B',
              borderlite: '#E5E5E5',
              purple: { 50: '#F5F3FF', 100: '#EDE9FE', 200: '#DDD6FE', 300: '#C4B5FD', 900: '#4C1D95' },
              orange: { 50: '#FFF7ED', 100: '#FFEDD5', 200: '#FED7AA', 400: '#FB923C', 500: '#EA580C', 600: '#D45F0A' },
            },
            fontFamily: {
              heading: ['Poppins', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              soft: '0 4px 12px rgba(0,0,0,0.05)',
              hover: '0 8px 24px rgba(0,0,0,0.08)',
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* ─── Base ──────────────────────────────────────────── */
      body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
        background-color: #F6F4FF;
      }
      h1, h2, h3, h4, .font-display, .font-heading {
        font-family: 'Poppins', sans-serif;
      }

      /* Compatibilidade retroativa — classes usadas na Home e na página Kids,
         recoloridas para o roxo/laranja oficial em vez de removidas por página. */
      .bg-brand-gradient      { background: linear-gradient(135deg, #6B2D8B 0%, #52206B 100%); }
      .bg-brand-gradient-soft { background: linear-gradient(160deg, #6B2D8B 0%, #8B3FAF 100%); }
      .text-lavender          { color: #FFD9B3; }
      .highlight-pill         { background: rgba(245,124,32,0.22); border-radius: 0.5em; padding: 0 0.18em; }
      .bg-page, .bg-cream     { background-color: #F6F4FF; }
      .bg-deep-purple         { background-color: #52206B; }
      .text-deep-purple       { color: #52206B; }

      /* ─── Ícones finos (global Lucide) ──────────────────── */
      main svg, header svg, footer svg { stroke-width: 1.5; }

      /* Pílula — rounded-full para CTAs principais */
      .rounded-full { border-radius: 9999px; }

      /* Scrollbar hiding for category nav */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Smooth animations */
      .animate-in { animation: fadeIn 0.3s ease both; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

      /* Marquee infinito — faixa de destinos na Home */
      .animate-marquee { animation: marquee 22s linear infinite; }
      @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    </style>
