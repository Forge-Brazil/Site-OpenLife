    <style>
      /* ─── Base ──────────────────────────────────────────── */
      body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
        background-color: #F8F5EF;   /* creme papel — tom de página premium */
      }

      /* Display serif — headlines editoriais (rebranding OpenLife) */
      .font-display {
        font-family: 'Fraunces', Georgia, serif;
        letter-spacing: -0.015em;
      }

      /* ─── Brand: Índigo premium (primário) ──────────────── */
      :root {
        --indigo: #2D1B4E;
        --indigo-soft: #4A3470;
        --gold: #C9A961;
        --gold-soft: #E8D9B5;
        --cream: #F8F5EF;
        --graphite: #2A2724;
        --page-bg: #F8F5EF;
      }

      .bg-purple-brand         { background-color: #2D1B4E !important; }
      .text-purple-brand       { color: #2D1B4E !important; }
      .border-purple-brand     { border-color: #2D1B4E !important; }
      .ring-purple-brand       { --tw-ring-color: #2D1B4E; }

      .hover\:bg-purple-brand:hover       { background-color: #2D1B4E !important; }
      .hover\:bg-purple-900:hover         { background-color: #1E1235 !important; }
      .hover\:text-purple-brand:hover     { color: #2D1B4E !important; }
      .hover\:border-purple-brand:hover   { border-color: #2D1B4E !important; }
      .focus\:ring-purple-brand:focus     { box-shadow: 0 0 0 3px rgba(45,27,78,0.25); }

      /* Indigo gradient */
      .from-purple-brand  { --tw-gradient-from: #2D1B4E; }
      .to-purple-brand    { --tw-gradient-to: #2D1B4E; }
      .via-purple-brand   { --tw-gradient-via: #2D1B4E; }

      /* Indigo shadow utility */
      .shadow-purple-brand\/20  { box-shadow: 0 8px 24px -4px rgba(45,27,78,0.20); }
      .shadow-purple-brand\/40  { box-shadow: 0 8px 24px -4px rgba(45,27,78,0.40); }

      /* Bg tints — derivados do índigo sobre creme */
      .bg-purple-50  { background-color: #F3F0F7 !important; }
      .bg-purple-100 { background-color: #E7E1EF !important; }
      .bg-purple-900 { background-color: #1E1235 !important; }
      .text-purple-100 { color: #E7E1EF !important; }
      .text-purple-200 { color: #CFC5DE !important; }
      .text-purple-300 { color: #B0A1C9 !important; }
      .border-purple-100 { border-color: #E7E1EF !important; }
      .border-purple-200 { border-color: #CFC5DE !important; }
      .hover\:bg-purple-50:hover { background-color: #F3F0F7 !important; }

      /* ─── Brand: Dourado champagne (acento / conquista) ─── */
      /* Botões dourados usam texto índigo — nunca branco (contraste). */
      .bg-orange-brand         { background-color: #C9A961 !important; color: #2D1B4E !important; }
      .text-orange-brand       { color: #A98435 !important; }
      .border-orange-brand     { border-color: #C9A961 !important; }

      .hover\:bg-orange-brand:hover   { background-color: #C9A961 !important; color: #2D1B4E !important; }
      .hover\:bg-orange-500:hover     { background-color: #B8944A !important; color: #2D1B4E !important; }
      .hover\:bg-orange-600:hover     { background-color: #B8944A !important; color: #2D1B4E !important; }
      .hover\:text-orange-brand:hover { color: #A98435 !important; }
      .hover\:text-orange-400:hover   { color: #C9A961 !important; }
      .hover\:text-orange-500:hover   { color: #A98435 !important; }

      .bg-orange-50  { background-color: #F5EEDD !important; }
      .bg-orange-100 { background-color: #E8D9B5 !important; }
      .text-orange-100 { color: #F5EEDD !important; }
      .text-orange-200 { color: #E8D9B5 !important; }
      .border-orange-200 { border-color: #E8D9B5 !important; }

      .from-orange-brand { --tw-gradient-from: #C9A961; }
      .to-orange-600     { --tw-gradient-to: #B8944A; }

      /* Acentos por linha de produto */
      .text-kids  { color: #FF8E72; }
      .text-teens { color: #4FB3A9; }
      .bg-kids-soft  { background-color: #FFEDE8; }
      .bg-teens-soft { background-color: #E5F3F1; }

      /* ─── Ícones finos (global Lucide) ──────────────────── */
      main svg,
      header svg,
      footer svg {
        stroke-width: 1.5;
      }

      /* ─── Utilitários extras ─────────────────────────────── */
      .bg-page       { background-color: #F8F5EF; }
      .bg-cream      { background-color: #F8F5EF; }
      .bg-deep-purple { background-color: #1E1235; }

      /* Pílula — rounded-full para CTAs principais */
      .rounded-full { border-radius: 9999px; }

      /* Scrollbar hiding for category nav */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Smooth animations */
      .animate-in { animation: fadeIn 0.3s ease both; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

      /* Marquee infinito — faixa de destinos na Home */
      .animate-marquee { animation: marquee 22s linear infinite; }
      @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
