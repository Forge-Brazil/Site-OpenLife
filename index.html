    <style>
      /* ─── Base ──────────────────────────────────────────── */
      body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
        background-color: #FAF8FF;   /* lilás quase-branco — tom de página */
      }

      /* Display — sans arredondada bold (identidade Instagram OpenLife) */
      .font-display {
        font-family: 'Nunito', 'Inter', sans-serif;
        letter-spacing: -0.01em;
      }

      /* ─── Brand: Violeta vibrante (identidade real do Instagram) ── */
      :root {
        --violet-deep: #4C1D95;
        --violet: #7C3AED;
        --violet-bright: #A855F7;
        --lavender: #C4B5FD;
        --orange: #F57C20;
        --page-bg: #FAF8FF;
      }

      .bg-purple-brand         { background: linear-gradient(135deg, #4C1D95 0%, #7C3AED 55%, #9333EA 100%) !important; }
      .text-purple-brand       { color: #6D28D9 !important; }
      .border-purple-brand     { border-color: #7C3AED !important; }
      .ring-purple-brand       { --tw-ring-color: #7C3AED; }

      .hover\:bg-purple-brand:hover       { background: #6D28D9 !important; }
      .hover\:bg-purple-900:hover         { background-color: #4C1D95 !important; }
      .hover\:text-purple-brand:hover     { color: #6D28D9 !important; }
      .hover\:border-purple-brand:hover   { border-color: #7C3AED !important; }
      .focus\:ring-purple-brand:focus     { box-shadow: 0 0 0 3px rgba(124,58,237,0.25); }

      /* Gradiente da marca — hero e seções escuras */
      .bg-brand-gradient { background: linear-gradient(135deg, #4C1D95 0%, #6D28D9 40%, #9333EA 100%); }
      .bg-brand-gradient-soft { background: linear-gradient(160deg, #7C3AED 0%, #A855F7 100%); }
      .from-purple-brand  { --tw-gradient-from: #7C3AED; }
      .to-purple-brand    { --tw-gradient-to: #7C3AED; }
      .via-purple-brand   { --tw-gradient-via: #7C3AED; }

      .shadow-purple-brand\/20  { box-shadow: 0 8px 24px -4px rgba(124,58,237,0.20); }
      .shadow-purple-brand\/40  { box-shadow: 0 8px 24px -4px rgba(124,58,237,0.40); }

      /* Tints violeta */
      .bg-purple-50  { background-color: #F5F3FF !important; }
      .bg-purple-100 { background-color: #EDE9FE !important; }
      .bg-purple-900 { background-color: #4C1D95 !important; }
      .text-purple-100 { color: #EDE9FE !important; }
      .text-purple-200 { color: #DDD6FE !important; }
      .text-purple-300 { color: #C4B5FD !important; }
      .border-purple-100 { border-color: #EDE9FE !important; }
      .border-purple-200 { border-color: #DDD6FE !important; }
      .hover\:bg-purple-50:hover { background-color: #F5F3FF !important; }

      /* Palavra destacada em lavanda — assinatura visual dos posts */
      .text-lavender { color: #C4B5FD; }
      .highlight-pill {
        background: rgba(196,181,253,0.25);
        border-radius: 0.5em;
        padding: 0 0.18em;
      }

      /* ─── Brand: Laranja do logo (CTA / energia) ────────── */
      .bg-orange-brand         { background-color: #F57C20 !important; }
      .text-orange-brand       { color: #EA6A0A !important; }
      .border-orange-brand     { border-color: #F57C20 !important; }

      .hover\:bg-orange-brand:hover   { background-color: #F57C20 !important; }
      .hover\:bg-orange-500:hover     { background-color: #E06A10 !important; }
      .hover\:bg-orange-600:hover     { background-color: #D45F0A !important; }
      .hover\:text-orange-brand:hover { color: #EA6A0A !important; }
      .hover\:text-orange-400:hover   { color: #FB923C !important; }
      .hover\:text-orange-500:hover   { color: #EA6A0A !important; }

      .bg-orange-50  { background-color: #FFF4EB !important; }
      .bg-orange-100 { background-color: #FFE6D0 !important; }
      .text-orange-100 { color: #FFE6D0 !important; }
      .text-orange-200 { color: #FED7AA !important; }
      .border-orange-200 { border-color: #FED7AA !important; }

      .from-orange-brand { --tw-gradient-from: #F57C20; }
      .to-orange-600     { --tw-gradient-to: #D45F0A; }

      /* ─── Ícones finos (global Lucide) ──────────────────── */
      main svg,
      header svg,
      footer svg {
        stroke-width: 1.5;
      }

      /* ─── Utilitários extras ─────────────────────────────── */
      .bg-page       { background-color: #FAF8FF; }
      .bg-cream      { background-color: #FAF8FF; }
      .bg-deep-purple { background-color: #4C1D95; }
      .text-deep-purple { color: #4C1D95; }

      /* Pílula — rounded-full para CTAs principais */
      .rounded-full { border-radius: 9999px; }

      /* Scrollbar hiding for category nav */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Smooth animations */
      .animate-in { animation: fadeIn 0.3s ease both; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

      /* Marquee infinito — faixa de destinos na Home */
      .animate-marquee { animation: marquee 22s linear infinite; }
      @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
